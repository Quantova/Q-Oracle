# Q-Oracle is the ONLY deny-list-EXEMPT repository (the Airlock boundary, POLICY-crypto.md section 7).
# Classical cryptography is permitted here and NOWHERE else; nothing in the organization may import
# this repo. License and advisory checks still apply.
#
# blst is an off-chain oracle exemption. It is the audited BLS12-381 pairing that verifies the
# Ethereum sync committee aggregate off chain, because verifying Ethereum needs Ethereum's own
# crypto. blst stays inside q-bls and the oracle and is never linked into the chain, the VM, or
# consensus. Only the ML-DSA attestation and the hash STARK cross the Airlock.

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    "k256",
    "ed25519-dalek",
    "curve25519-dalek",
    "p256",
    "secp256k1",
    "rsa",
    "bls12_381",
    "ark-ec",
    "ark-bls12-381",
    "ark-groth16",
    "pairing",
    "openssl",
    "openssl-sys",
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0"]
confidence-threshold = 0.9

