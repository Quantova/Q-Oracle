name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: Q-Oracle
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/q-prover
          ref: b0ec415252b88694710b2038a0b059715d301e6d
          path: q-prover
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/Q-Lightclient
          ref: 251424da8b4c73ea9cf3f0c83de814e3474fb90f
          path: Q-Lightclient
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QRC-CONSENSUS
          ref: 213f177951f8d470dff13966f9e8753a3836dcc5
          path: QRC-CONSENSUS
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/Quantova-Chain
          ref: 043d72d6db6b7b4da246c558f162545b08118d18
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QCore.rs
          ref: be45acf88cae01525f836679f6f1bbd90c4693ed
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QVM
          ref: 58a2d5092eaca6d6c8f607d2045fe22988bf7eb6
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        working-directory: Q-Oracle
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: Q-Oracle
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: Q-Oracle
        run: cargo test --all-features --locked
