name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: Q-Oracle
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/q-prover
          ref: main
          path: q-prover
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/Q-Lightclient
          ref: main
          path: Q-Lightclient
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QRC-CONSENSUS
          ref: main
          path: QRC-CONSENSUS
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/Quantova-Chain
          ref: main
          path: Quantova-Chain
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QCore.rs
          ref: main
          path: QCore.rs
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Quantova/QVM
          ref: main
          path: QVM
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        working-directory: Q-Oracle
        run: cargo fmt --all -- --check
      - name: clippy
        working-directory: Q-Oracle
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: test
        working-directory: Q-Oracle
        run: cargo test --all-features --locked
