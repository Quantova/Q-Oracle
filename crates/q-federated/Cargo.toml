[package]
name = "q-federated"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The federated corridor tier. Chains with no trustless light client stay a bonded m-of-n ML-DSA attestor quorum, labeled honestly as the trusted relayer tier. Each operator watches its own independent foreign source and attests a deposit over the canonical bridge-fact preimage. No foreign signature or header is verified on chain. Membership and quorum are enforced through the hardened gateway and the source-independence gate. The operator bond is a chain-side hook."

[dependencies]
q-codec = { workspace = true }
q-airlock = { workspace = true }
q-gateway = { workspace = true }
q-attestor = { workspace = true }
q-isolation = { path = "../q-isolation" }

[dev-dependencies]
qtv-crypto = { workspace = true }
q-codec = { workspace = true }
q-airlock = { workspace = true }
