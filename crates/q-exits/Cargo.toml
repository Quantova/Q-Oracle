[package]
name = "q-exits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Executable reference model of the outward bridge exit as an over-collateralized vault. A finalized Quantova burn is proven post-quantum: the QORUS committee finality certificate over the block header is verified against a pinned committee and the burn event leaf is proven included under the header event root by a SHA-3 Merkle path, and the exit amount, asset, beneficiary, and burn_ref are read only from that proven leaf. The proven burn opens an exit that locks vault collateral above the value it custodies. That collateral is released when the vault proves its foreign payout within the window. When it does not, the whole locked collateral is seized from the vault, and this model pays the user nothing from it. An exit that settles without a payout proof relies on a quorum of operator acknowledgements, so that path trusts the operator set. The burn_ref is the replay key so one burn opens at most one exit. The foreign payout proof is a hash-based SPV seam and the chain sees only Quantova-native artifacts. It is a library and is not wired to any live caller."

[dependencies]
q-codec = { workspace = true }
qtv-crypto = { workspace = true }
qlc-bitcoin = { workspace = true }
qlc-ethereum = { workspace = true }
qtv-block = { path = "../../../Quantova-Chain/crates/qtv-block" }
qtv-codec = { path = "../../../Quantova-Chain/crates/qtv-codec" }
qtv-attest = { path = "../../../QRC-CONSENSUS/crates/qtv-attest" }
qtv-sampler = { path = "../../../QRC-CONSENSUS/crates/qtv-sampler" }
zeroize = "1.9"

[dev-dependencies]
q-codec = { workspace = true }
qtv-crypto = { workspace = true }
qtv-attest = { path = "../../../QRC-CONSENSUS/crates/qtv-attest", features = ["test-fixtures"] }
qtv-sampler = { path = "../../../QRC-CONSENSUS/crates/qtv-sampler", features = ["test-fixtures"] }
