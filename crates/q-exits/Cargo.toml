[package]
name = "q-exits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Executable reference model of the on-chain q-exits contract. A finalized Quantova burn yields a hash-based exit certificate over an exit statement, an over-collateralized vault is assigned collateral above the value it custodies, and that collateral is released when a native payout attestation binds the payout within the window or slashed to pay the user at a premium when it does not. There is no trusted signer and no threshold key. The hash-based STARK prover and the foreign payout watcher are the two off-chain seams, and the chain sees only Quantova-native artifacts."

[dependencies]
q-codec = { workspace = true }
qtv-crypto = { workspace = true }
qlc-bitcoin = { workspace = true }
qlc-ethereum = { workspace = true }

[dev-dependencies]
q-codec = { workspace = true }
qtv-crypto = { workspace = true }
