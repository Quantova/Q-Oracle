[workspace]
resolver = "2"
members = [
    "crates/q-codec",
    "crates/q-airlock",
    "crates/q-attestor",
    "crates/q-gateway",
    "crates/q-watchtower",
    "crates/q-assets",
    "crates/q-federated",
    "crates/q-exits",
    "crates/q-bls",
    "crates/q-prover-bridge",
    "crates/q-isolation",
    "crates/qlc-cosmos",
    "crates/qlc-ethereum",
    "crates/qlc-bitcoin",
    "crates/q-qbridge",
    "crates/q-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.89"

[workspace.dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "28c0fff8f620c1663663f4bd271b7bae3dbddc80" }
qlc-bitcoin = { path = "crates/qlc-bitcoin" }
qlc-ethereum = { path = "crates/qlc-ethereum" }
qlc-cosmos = { path = "crates/qlc-cosmos" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "7bfc059e419e1320397b838c14625cc10e915a8f" }
qlc-core = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-stark = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-registry = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-airlock = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "28d1bdf65ce596af66c8ec2a8c9dc3a58eb12a51" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "1c0ae3504f9ba07e69d39e8df5fcbccf65248b12" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "1c0ae3504f9ba07e69d39e8df5fcbccf65248b12" }
q-codec = { path = "crates/q-codec" }
q-airlock = { path = "crates/q-airlock" }
q-attestor = { path = "crates/q-attestor" }
q-gateway = { path = "crates/q-gateway" }
q-assets = { path = "crates/q-assets" }
q-watchtower = { path = "crates/q-watchtower" }
q-federated = { path = "crates/q-federated" }

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.release]
overflow-checks = true
