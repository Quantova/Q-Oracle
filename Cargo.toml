[workspace]
resolver = "2"
members = [
    "crates/q-codec",
    "crates/q-airlock",
    "crates/q-attestor",
    "crates/q-gateway",
    "crates/q-watchtower",
    "crates/q-assets",
    "crates/q-federated",
    "crates/q-exits",
    "crates/q-bls",
    "crates/q-prover-bridge",
    "crates/q-isolation",
    "crates/qlc-cosmos",
    "crates/qlc-ethereum",
    "crates/qlc-bitcoin",
    "crates/q-qbridge",
    "crates/q-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.89"

[workspace.dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4e37c52984740f345f96e2c8536803bce5f3b805" }
qlc-bitcoin = { path = "crates/qlc-bitcoin" }
qlc-ethereum = { path = "crates/qlc-ethereum" }
qlc-cosmos = { path = "crates/qlc-cosmos" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "c56ce780ce3e20889fb3fab94c7dadc998809de3" }
qlc-core = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-stark = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-registry = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-airlock = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "91531ad9cccb742f6f8c993ec07a77174a159741" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "91531ad9cccb742f6f8c993ec07a77174a159741" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "91531ad9cccb742f6f8c993ec07a77174a159741" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "f4982eb07c20cdc0265797ef6c3fac90bf3976be" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "f4982eb07c20cdc0265797ef6c3fac90bf3976be" }
q-codec = { path = "crates/q-codec" }
q-airlock = { path = "crates/q-airlock" }
q-attestor = { path = "crates/q-attestor" }
q-gateway = { path = "crates/q-gateway" }
q-assets = { path = "crates/q-assets" }
q-watchtower = { path = "crates/q-watchtower" }
q-federated = { path = "crates/q-federated" }

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.release]
overflow-checks = true
