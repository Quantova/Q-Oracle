[workspace]
resolver = "2"
members = [
    "crates/q-codec",
    "crates/q-airlock",
    "crates/q-attestor",
    "crates/q-gateway",
    "crates/q-watchtower",
    "crates/q-assets",
    "crates/q-federated",
    "crates/q-exits",
    "crates/q-bls",
    "crates/q-prover-bridge",
    "crates/q-isolation",
    "crates/qlc-cosmos",
    "crates/qlc-ethereum",
    "crates/qlc-bitcoin",
    "crates/q-qbridge",
    "crates/q-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.89"

[workspace.dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "04e5ae26a089df4e4cc8f20f3973b7cbbee594e3" }
qlc-bitcoin = { path = "crates/qlc-bitcoin" }
qlc-ethereum = { path = "crates/qlc-ethereum" }
qlc-cosmos = { path = "crates/qlc-cosmos" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "c7c29419faf2f5aa4583631a235a3fe764d3475c" }
qlc-core = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-stark = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-registry = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qlc-airlock = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "b2842ae74c8df3b872b72fe9b17e49036b600980" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "e349230bdd653f7436964a3c6de65af367d638be" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "e349230bdd653f7436964a3c6de65af367d638be" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "e349230bdd653f7436964a3c6de65af367d638be" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "223e012417d804d2e953445c38c2b87d0bff6b34" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "223e012417d804d2e953445c38c2b87d0bff6b34" }
q-codec = { path = "crates/q-codec" }
q-airlock = { path = "crates/q-airlock" }
q-attestor = { path = "crates/q-attestor" }
q-gateway = { path = "crates/q-gateway" }
q-assets = { path = "crates/q-assets" }
q-watchtower = { path = "crates/q-watchtower" }
q-federated = { path = "crates/q-federated" }

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.release]
overflow-checks = true
