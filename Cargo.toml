[workspace]
resolver = "2"
members = [
    "crates/q-codec",
    "crates/q-airlock",
    "crates/q-attestor",
    "crates/q-gateway",
    "crates/q-watchtower",
    "crates/q-assets",
    "crates/q-federated",
    "crates/q-exits",
    "crates/q-bls",
    "crates/q-prover-bridge",
    "crates/q-isolation",
    "crates/qlc-cosmos",
    "crates/qlc-ethereum",
    "crates/qlc-bitcoin",
    "crates/q-qbridge",
    "crates/q-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.89"

[workspace.dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "38f41dede65ed1918e89402c61b711defe16ae26" }
qlc-bitcoin = { path = "crates/qlc-bitcoin" }
qlc-ethereum = { path = "crates/qlc-ethereum" }
qlc-cosmos = { path = "crates/qlc-cosmos" }
qtv-stark = { git = "https://github.com/Quantova/q-prover.git", rev = "c8a88e7a95b598ceefc2a57e934ba7e0e67adfbc" }
qlc-core = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "8163a6d695e7e00eb190cea91007488600a2f437" }
qlc-stark = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "8163a6d695e7e00eb190cea91007488600a2f437" }
qlc-registry = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "8163a6d695e7e00eb190cea91007488600a2f437" }
qlc-airlock = { git = "https://github.com/Quantova/Q-Lightclient.git", rev = "8163a6d695e7e00eb190cea91007488600a2f437" }
qtv-block = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-codec = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-state = { git = "https://github.com/Quantova/Quantova-Chain.git", rev = "19f2e8d5cde914ef618c5ddb564dc7dae79473ea" }
qtv-attest = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fb9297cde5e447226bc590af47eeb9340d554ca1" }
qtv-sampler = { git = "https://github.com/Quantova/QRC-CONSENSUS.git", rev = "fb9297cde5e447226bc590af47eeb9340d554ca1" }
q-codec = { path = "crates/q-codec" }
q-airlock = { path = "crates/q-airlock" }
q-attestor = { path = "crates/q-attestor" }
q-gateway = { path = "crates/q-gateway" }
q-assets = { path = "crates/q-assets" }
q-watchtower = { path = "crates/q-watchtower" }
q-federated = { path = "crates/q-federated" }

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.release]
overflow-checks = true
