[workspace]
resolver = "2"
members = [
    "crates/q-codec",
    "crates/q-airlock",
    "crates/q-attestor",
    "crates/q-gateway",
    "crates/q-watchtower",
    "crates/q-assets",
    "crates/q-federated",
    "crates/q-exits",
    "crates/q-bls",
    "crates/q-prover-bridge",
    "crates/q-isolation",
    "crates/qlc-cosmos",
    "crates/qlc-ethereum",
    "crates/qlc-bitcoin",
    "crates/q-qbridge",
    "crates/q-runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.75"

[workspace.dependencies]
qtv-crypto = { git = "https://github.com/Quantova/Q-Crypto.git", rev = "4d73a36c112b91a6a25a6a876f54cdccb729c7de" }
qlc-bitcoin = { path = "crates/qlc-bitcoin" }
qlc-ethereum = { path = "crates/qlc-ethereum" }
qlc-cosmos = { path = "crates/qlc-cosmos" }
qtv-stark = { path = "../q-prover/crates/qtv-stark" }
q-codec = { path = "crates/q-codec" }
q-airlock = { path = "crates/q-airlock" }
q-attestor = { path = "crates/q-attestor" }
q-gateway = { path = "crates/q-gateway" }
q-assets = { path = "crates/q-assets" }
q-federated = { path = "crates/q-federated" }

[profile.dev.package.qtv-crypto]
opt-level = 3

[profile.release]
overflow-checks = true
